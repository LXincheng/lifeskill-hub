services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lifeskill
      POSTGRES_USER: lifeskill
      POSTGRES_PASSWORD: lifeskill
    ports:
      - "5432:5432"
    volumes:
      - lifeskill-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeskill -d lifeskill"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lifeskill-postgres:
