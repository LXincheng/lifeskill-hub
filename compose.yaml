services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-lifeskill}
      POSTGRES_USER: ${DB_USERNAME:-lifeskill}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lifeskill}
    ports:
      - "5432:5432"
    volumes:
      - lifeskill-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-lifeskill} -d ${DB_NAME:-lifeskill}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lifeskill-postgres:
